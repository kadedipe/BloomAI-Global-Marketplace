services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bloomai
      POSTGRES_USER: bloomai
      POSTGRES_PASSWORD: bloomai
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bloomai"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes: [postgres_data:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  marketplace-api:
    build: ./services/marketplace-api
    environment:
      DATABASE_URL: postgresql+asyncpg://bloomai:bloomai@postgres:5432/bloomai
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: local-development-secret-change-me-12345
      CORS_ORIGINS: http://localhost:5173
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
  ai-api:
    build: ./services/ai-api
    environment:
      MODEL_PATH: /app/models/checkpoint.pth
      CORS_ORIGINS: http://localhost:5173
    ports: ["8001:8000"]
  event-worker:
    build: ./services/event-worker
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis: {condition: service_healthy}
  web:
    build:
      context: ./apps/web
      args:
        VITE_API_URL: http://localhost:8000
        VITE_AI_API_URL: http://localhost:8001
    ports: ["5173:8080"]
    depends_on: [marketplace-api, ai-api]
volumes:
  postgres_data:
