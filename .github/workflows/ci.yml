name: CI
on:
  pull_request:
  push: {branches: [main]}
permissions: {contents: read}
concurrency: {group: "ci-${{ github.ref }}", cancel-in-progress: true}
jobs:
  python-services:
    runs-on: ubuntu-latest
    strategy:
      matrix: {service: [marketplace-api, ai-api, event-worker]}
    defaults: {run: {working-directory: "services/${{ matrix.service }}"}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: "services/${{ matrix.service }}/requirements*.txt"}
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m ruff check .
        if: matrix.service == 'marketplace-api'
  model-contract:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: ai-services}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: ai-services/requirements-production*.txt}
      - run: pip install -r requirements-production-dev.txt
      - run: python -m pytest -q tests/test_modeling.py
  web:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: apps/web}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: npm ci
      - run: npm run build
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build services/marketplace-api
      - run: docker build services/ai-api
      - run: docker build services/event-worker
      - run: docker build apps/web

  supply-chain:
    runs-on: ubuntu-latest
    permissions: {contents: read, security-events: write}
    steps:
      - uses: actions/checkout@v4
      - uses: anchore/scan-action@v6
        with:
          path: .
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table
