databases:
  - name: bloomai-postgres
    databaseName: bloomai
    user: bloomai
    plan: free

services:
  - type: keyvalue
    name: bloomai-redis
    plan: free
    ipAllowList: []
  - type: web
    name: bloomai-marketplace-api
    runtime: docker
    dockerfilePath: ./services/marketplace-api/Dockerfile
    dockerContext: ./services/marketplace-api
    healthCheckPath: /health/ready
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase: {name: bloomai-postgres, property: connectionString}
      - key: REDIS_URL
        fromService: {type: keyvalue, name: bloomai-redis, property: connectionString}
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
  - type: web
    name: bloomai-ai-api
    runtime: docker
    dockerfilePath: ./services/ai-api/Dockerfile
    dockerContext: ./services/ai-api
    healthCheckPath: /health/live
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: MODEL_PATH
        value: /app/models/checkpoint.pth
      - key: CORS_ORIGINS
        sync: false
  - type: web
    name: bloomai-web
    runtime: static
    rootDir: apps/web
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: true
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_AI_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
